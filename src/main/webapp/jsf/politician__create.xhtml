<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/jsf/template/template.xhtml">

    <f:metadata>
        <f:viewParam name="id" value="#{politicianFormJsf.id}" required="false"/>
        <f:viewAction action="#{politicianFormJsf.init()}"/>
    </f:metadata>

    <ui:define name="content">
        <h2>
            #{msg['politician.form.title']}
        </h2>

        <!-- Opcjonalnie: globalne komunikaty (np. błędy spoza konkretnych pól) -->
        <h:messages globalOnly="true" style="color: red;"/>

        <h:form id="politicianForm" styleClass="container" enctype="multipart/form-data">
            <div>
                <h:outputLabel for="id" value="#{msg['party.id']}:"/>
                <h:inputText id="id" value="#{politicianFormJsf.politician.id}"
                             disabled="#{politicianFormJsf.exists}"
                             required="true"
                             requiredMessage="#{msg['validation.required']}">
                </h:inputText>
                <h:message for="id" style="color: red;"/>
            </div>
            <div>
                <h:outputLabel for="name" value="#{msg['politician.name']}:"/>
                <h:inputText id="name" value="#{politicianFormJsf.politician.name}"
                             required="true"
                             requiredMessage="#{msg['validation.required']}">
                </h:inputText>
                <h:message for="name" style="color: red;"/>
            </div>
            <div>
                <h:outputLabel for="surname" value="#{msg['politician.surname']}:"/>
                <h:inputText id="surname" value="#{politicianFormJsf.politician.surname}"
                             required="true"
                             requiredMessage="#{msg['validation.required']}">
                </h:inputText>
                <h:message for="surname" style="color: red;"/>
            </div>
            <div>
                <h:outputLabel for="birthDate" value="#{msg['politician.birthDate']}:"/>
                <h:inputText id="birthDate" value="#{politicianFormJsf.politician.birthDate}"
                             required="true"
                             requiredMessage="#{msg['validation.required']}"
                             converterMessage="#{msg['validation.dateFormat']}">
                    <f:convertDateTime type="localDate" pattern="yyyy-MM-dd"/>
                </h:inputText>
                <h:message for="birthDate" style="color: red;"/>
            </div>
            <div>
                <h:outputLabel for="constituency" value="#{msg['politician.constituency']}:"/>
                <h:inputText id="constituency" value="#{politicianFormJsf.politician.constituency}"
                             required="true"
                             requiredMessage="#{msg['validation.required']}"
                             converterMessage="#{msg['validation.numberFormat']}"
                             validatorMessage="#{msg['validation.constituencyRange']}">
                    <f:validateLongRange minimum="1"/>
                </h:inputText>
                <h:message for="constituency" style="color: red;"/>
            </div>
            <div>
                <h:outputLabel for="politicalPartySelect" value="#{msg['politician.party']}:"/>
                <h:selectOneMenu id="politicalPartySelect" value="#{politicianFormJsf.politician.politicalParty}"
                                 required="true"
                                 requiredMessage="#{msg['validation.required']}">
                    <f:selectItem itemLabel="#{msg['politician.selectParty']}" itemValue="#{null}"/>
                    <f:selectItems value="#{politicianFormJsf.politicalParties}"
                                   var="party"
                                   itemLabel="#{party.name}"
                                   itemValue="#{party}"/>
                </h:selectOneMenu>
                <h:message for="politicalPartySelect" style="color: red;"/>
            </div>
            <h:panelGroup layout="block" rendered="#{politicianFormJsf.canEditOwner()}">
                <h:outputLabel for="userSelect" value="#{msg['politician.owner']}:"/>
                <h:selectOneMenu id="userSelect" value="#{politicianFormJsf.selectedUserId}"
                                 required="true"
                                 requiredMessage="#{msg['validation.required']}">
                    <f:selectItem itemLabel="#{msg['politician.selectUser']}" itemValue="#{null}"/>
                    <f:selectItems value="#{politicianFormJsf.users}"
                                   var="user"
                                   itemLabel="#{user.username}"
                                   itemValue="#{user.id}"/>
                </h:selectOneMenu>
                <h:message for="userSelect" style="color: red;"/>
            </h:panelGroup>

            <h:commandButton value="#{msg['common.save']}" action="#{politicianFormJsf.save}"/>
        </h:form>
    </ui:define>
</ui:composition>
