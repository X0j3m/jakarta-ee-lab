<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/jsf/template/template.xhtml">

    <f:metadata>
        <f:viewParam name="id" value="#{politicianJsfElement.id}" required="true"/>
        <f:viewAction action="#{politicianJsfElement.init()}"/>
    </f:metadata>

    <ui:define name="content">
        <h2>
            Politician view
        </h2>

        <header><h2><h:outputText value="#{politicianJsfElement.politician.name}"/></h2></header>
        <div>
            <div>
                <strong>
                    ID:
                </strong>
                <span>
                        <h:outputText value="#{politicianJsfElement.politician.id}"/>
                    </span>
            </div>
            <div>
                <strong>
                    Name:
                </strong>
                <span>
                        <h:outputText value="#{politicianJsfElement.politician.name}"/>
                    </span>
            </div>
            <div>
                <strong>
                    Surname:
                </strong>
                <span>
                        <h:outputText value="#{politicianJsfElement.politician.surname}"/>
                    </span>
            </div>
            <div>
                <strong>
                    Birth date:
                </strong>
                <span>
                        <h:outputText value="#{politicianJsfElement.politician.birthDate}"/>
                    </span>
            </div>
            <div>
                <strong>
                    Constituency:
                </strong>
                <span>
                        <h:outputText value="#{politicianJsfElement.politician.constituency}"/>
                    </span>
            </div>
        </div>
    </ui:define>
</ui:composition>
