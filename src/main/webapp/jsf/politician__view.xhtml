<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/jsf/template/template.xhtml">

    <f:metadata>
        <f:viewParam name="id" value="#{politicianJsfElement.id}" required="true"/>
        <f:viewAction action="#{politicianJsfElement.init()}"/>
    </f:metadata>

    <ui:define name="content">
        <h2>
            #{msg['politician.view.title']}
        </h2>

        <header><h2><h:outputText value="#{politicianJsfElement.politician.name}"/></h2></header>
        <div>
            <div>
                <strong>
                    #{msg['party.id']}:
                </strong>
                <span>
                    <h:outputText value="#{politicianJsfElement.politician.id}"/>
                </span>
            </div>
            <div>
                <strong>
                    #{msg['politician.name']}:
                </strong>
                <span>
                    <h:outputText value="#{politicianJsfElement.politician.name}"/>
                </span>
            </div>
            <div>
                <strong>
                    #{msg['politician.surname']}:
                </strong>
                <span>
                    <h:outputText value="#{politicianJsfElement.politician.surname}"/>
                </span>
            </div>
            <div>
                <strong>
                    #{msg['politician.birthDate']}:
                </strong>
                <span>
                    <h:outputText value="#{politicianJsfElement.politician.birthDate}"/>
                </span>
            </div>
            <div>
                <strong>
                    #{msg['politician.constituency']}:
                </strong>
                <span>
                    <h:outputText value="#{politicianJsfElement.politician.constituency}"/>
                </span>
            </div>
            <div>
                <strong>
                    #{msg['politician.userId']}:
                </strong>
                <span>
                    <h:outputText value="#{politicianJsfElement.politician.user}"/>
                </span>
            </div>
        </div>
    </ui:define>
</ui:composition>
