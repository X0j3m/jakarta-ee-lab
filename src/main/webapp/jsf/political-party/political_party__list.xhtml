<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/jsf/template/template.xhtml">

    <ui:define name="content">
        <h1>
            Political party list
        </h1>

        <h:dataTable id="politicalParties" value="#{politicalPartyJsfList.politicalPartyList}" var="politicalParty">
            <h:column>
                <f:facet name="header">Name</f:facet>
                <h:outputText id="nameValue" value="#{politicalParty.name}">
                    <f:passThroughAttribute name="data-name" value="${politicalParty.name}"/>
                </h:outputText>
            </h:column>
            <h:column>
                <f:facet name="header">Foundation date</f:facet>
                <h:outputText id="foundationDateValue" value="#{politicalParty.foundationDate}">
                    <f:passThroughAttribute name="data-foundationDate" value="${politicalParty.foundationDate}"/>
                </h:outputText>
            </h:column>
            <h:column>
                <f:facet name="header">Orientation</f:facet>
                <h:outputText id="orientationValue" value="#{politicalParty.orientation}">
                    <f:passThroughAttribute name="data-orientation" value="${politicalParty.orientation}"/>
                </h:outputText>
            </h:column>
            <h:column>
                <f:facet name="header">View</f:facet>
                <h:link id="viewLink" outcome="/jsf/political-party/political_party__view.xhtml" value="View">
                    <f:param name="id" value="#{politicalParty.id}"/>
                </h:link>
            </h:column>
            <h:column>
                <f:facet name="header">Delete</f:facet>
                <h:form>
                    <h:commandButton id="deleteButton" styleClass="btn" value="Delete"
                                     action="#{politicalPartyJsfList.deletePoliticalParty(politicalParty.id)}"/>
                </h:form>
            </h:column>
        </h:dataTable>
    </ui:define>
</ui:composition>
