<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/jsf/template/template.xhtml">

    <f:metadata>
        <f:viewParam name="id" value="#{politicianFormJsf.id}" required="false"/>
        <f:viewAction action="#{politicianFormJsf.init()}"/>
    </f:metadata>

    <ui:define name="content">
        <h1>
            Politician create / edit
        </h1>

        <h:form id="politicianForm" styleClass="container" enctype="multipart/form-data">
            <div>
                <h:outputLabel for="id" value="Id:"/>
                <h:inputText id="id" value="#{politicianFormJsf.politician.id}"
                             disabled="#{politicianFormJsf.exists}"/>
            </div>
            <div>
                <h:outputLabel for="name" value="Name:"/>
                <h:inputText id="name" value="#{politicianFormJsf.politician.name}"/>
            </div>
            <div>
                <h:outputLabel for="surname" value="Surname:"/>
                <h:inputText id="surname" value="#{politicianFormJsf.politician.surname}"/>
            </div>
            <div>
                <h:outputLabel for="birthDate" value="Birth date:"/>
                <h:inputText id="birthDate" value="#{politicianFormJsf.politician.birthDate}">
                    <f:convertDateTime type="localDate" pattern="yyyy-MM-dd"/>
                </h:inputText>
            </div>
            <div>
                <h:outputLabel for="constituency" value="Constituency:"/>
                <h:inputText id="constituency" value="#{politicianFormJsf.politician.constituency}"/>
            </div>
            <div>
                <h:outputLabel for="politicalPartySelect" value="Political party:"/>

                <h:selectOneMenu id="politicalPartySelect" value="#{politicianFormJsf.politician.politicalParty}">
                    <f:selectItem itemLabel="SELECT" itemValue="#{null}"/>
                    <f:selectItems value="#{politicianFormJsf.politicalParties}"
                                   var="party"
                                   itemLabel="#{party.name}"
                                   itemValue="#{party}"/>
                </h:selectOneMenu>
            </div>

            <h:commandButton value="Save" action="#{politicianFormJsf.save}"/>
        </h:form>
    </ui:define>
</ui:composition>
