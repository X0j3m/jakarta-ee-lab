<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/jsf/template/template.xhtml">

    <ui:define name="content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h2 style="margin: 0;">
                #{msg['parties.title']}
            </h2>
        </div>

        <h:form id="politicalPartiesForm">
            <h:dataTable styleClass="table" id="politicalParties" value="#{politicalPartyJsfList.politicalPartyList}"
                         var="politicalParty">
                <h:column styleClass="table">
                    <f:facet name="header">#{msg['party.name']}</f:facet>
                    <h:outputText id="nameValue" value="#{politicalParty.name}">
                        <f:passThroughAttribute name="data-name" value="#{politicalParty.name}"/>
                    </h:outputText>
                </h:column>
                <h:column styleClass="table">
                    <f:facet name="header">#{msg['party.foundationDate']}</f:facet>
                    <h:outputText id="foundationDateValue" value="#{politicalParty.foundationDate}">
                        <f:passThroughAttribute name="data-foundationDate" value="#{politicalParty.foundationDate}"/>
                    </h:outputText>
                </h:column>
                <h:column styleClass="table">
                    <f:facet name="header">#{msg['party.orientation']}</f:facet>
                    <h:outputText id="orientationValue" value="#{politicalParty.orientation}">
                        <f:passThroughAttribute name="data-orientation" value="#{politicalParty.orientation}"/>
                    </h:outputText>
                </h:column>
                <h:column styleClass="table">
                    <f:facet name="header">#{msg['common.view']}</f:facet>
                    <h:link id="viewLink" outcome="/jsf/political_party__view.xhtml" value="#{msg['common.view']}">
                        <f:param name="id" value="#{politicalParty.id}"/>
                    </h:link>
                </h:column>
                <h:column styleClass="table" rendered="#{request.isUserInRole('admin')}">
                    <f:facet name="header">#{msg['common.delete']}</f:facet>
                    <h:commandButton id="deleteButton" styleClass="btn" value="#{msg['common.delete']}"
                                     action="#{politicalPartyJsfList.deletePoliticalParty(politicalParty.id)}">
                        <f:ajax execute="@this" render="@form"/>
                    </h:commandButton>
                </h:column>
            </h:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
