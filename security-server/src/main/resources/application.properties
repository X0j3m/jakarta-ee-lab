spring.application.name=security-server
server.port=9000
spring.security.oauth2.authorizationserver.issuer=http://localhost:9000

spring.datasource.url=jdbc:h2:file:C:/temp/jakarta-ee-lab;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.servlet.session.cookie.name=AUTH_SERVER_SESSION

spring.security.oauth2.authorizationserver.client.jakarta-client.require-proof-key=false
spring.security.oauth2.authorizationserver.client.jakarta-client.registration.client-id=jakarta-client
spring.security.oauth2.authorizationserver.client.jakarta-client.registration.client-secret={noop}secret
spring.security.oauth2.authorizationserver.client.jakarta-client.registration.client-authentication-methods=client_secret_basic,client_secret_post
spring.security.oauth2.authorizationserver.client.jakarta-client.registration.authorization-grant-types=authorization_code,refresh_token
spring.security.oauth2.authorizationserver.client.jakarta-client.registration.redirect-uris=http://localhost:9080/jakarta-ee-lab/callback,http://localhost:9080/callback
spring.security.oauth2.authorizationserver.client.jakarta-client.registration.scopes=openid,profile